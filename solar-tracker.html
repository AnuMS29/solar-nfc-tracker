<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Asset Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0d1b3e;
      --navy-light: #1a2f5e;
      --steel: #5b7c99;
      --steel-dark: #46647d;
      --bg: #f4f6fb;
      --white: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #d1d5db;
      --error: #dc2626;
      --success: #16a34a;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    .page { display: none; min-height: 100dvh; flex-direction: column; }
    .page.active { display: flex; }

    /* Header */
    header {
      background: var(--navy);
      color: var(--white);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header span { font-size: 0.75rem; color: var(--steel); font-weight: 500; display: block; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    .logout-btn, .nav-btn {
      background: transparent;
      border: 1.5px solid var(--steel);
      color: var(--steel);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
      position: relative;
    }
    .logout-btn:hover, .nav-btn:hover { background: var(--steel); color: var(--white); }
    .nav-btn.has-badge::after {
      content: attr(data-count);
      position: absolute;
      top: -7px; right: -7px;
      background: var(--error);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn.has-badge[data-count="0"]::after { display: none; }

    /* Login Page */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 60%, #2a4080 100%);
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
    }

    .login-logo { text-align: center; margin-bottom: 22px; }
    .login-logo .icon { font-size: 2.5rem; }
    .login-logo h2 { font-size: 1.25rem; color: var(--navy); margin-top: 8px; font-weight: 700; }
    .login-logo p { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

    /* Auth Tabs */
    .auth-tabs {
      display: flex;
      background: #eef1f8;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
      user-select: none;
    }
    .auth-tab.active {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    /* Fields */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.2s;
      outline: none;
      font-family: inherit;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: var(--navy); }
    .field textarea { resize: vertical; min-height: 80px; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover:not(:disabled) { background: var(--navy-light); }
    .btn-accent { background: var(--steel); color: var(--white); }
    .btn-accent:hover:not(:disabled) { background: var(--steel-dark); }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--navy);
      color: var(--navy);
    }
    .btn-outline:hover:not(:disabled) { background: #f1f5ff; }

    .btn-sm {
      width: auto;
      padding: 7px 14px;
      font-size: 0.82rem;
      border-radius: 6px;
    }
    .btn-approve { background: var(--success); color: white; }
    .btn-approve:hover:not(:disabled) { background: #138a3f; }
    .btn-reject { background: var(--error); color: white; }
    .btn-reject:hover:not(:disabled) { background: #b91c1c; }
    .btn-remove { background: var(--error); color: white; }
    .btn-remove:hover:not(:disabled) { background: #b91c1c; }

    .tab-count {
      display: inline-block;
      background: rgba(0,0,0,0.12);
      color: inherit;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
      margin-left: 4px;
    }

    /* Messages */
    .error-msg {
      color: var(--error);
      font-size: 0.82rem;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
    .info-msg {
      color: var(--steel-dark);
      background: #eef3f7;
      border: 1.5px solid #cdd9e2;
      font-size: 0.82rem;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
      line-height: 1.4;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--navy);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
      max-width: 90vw;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    .spinner-dark {
      border-color: rgba(13,27,62,0.25);
      border-top-color: var(--navy);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scan page placeholder */
    .scan-body, .approvals-body { flex: 1; padding: 20px 16px; }
    .placeholder-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .placeholder-card h3 { color: var(--navy); margin-bottom: 8px; }
    .placeholder-card p { color: var(--muted); font-size: 0.88rem; }

    /* Approvals page */
    .approvals-header {
      margin-bottom: 16px;
    }
    .approvals-header h2 { color: var(--navy); font-size: 1.15rem; margin-bottom: 4px; }
    .approvals-header p { color: var(--muted); font-size: 0.85rem; }

    .user-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .user-info h4 { color: var(--navy); font-size: 0.95rem; margin-bottom: 2px; }
    .user-info p { color: var(--muted); font-size: 0.8rem; }
    .user-actions { display: flex; gap: 8px; }

    .empty-state {
      background: var(--white);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .empty-state p { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>

<!-- ══════════════════════ LOGIN / SIGNUP PAGE ══════════════════════ -->
<div class="page active" id="page-login">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">⚡</div>
        <h2>Solar Asset Tracker</h2>
        <p>NFC-based field management</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</div>
        <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <!-- SIGN IN FORM -->
      <div class="auth-form active" id="form-signin">
        <div class="field">
          <label>Email</label>
          <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn btn-accent" id="signin-btn" onclick="doSignIn()">Sign In</button>
        <p class="error-msg" id="signin-error"></p>
      </div>

      <!-- SIGN UP FORM -->
      <div class="auth-form" id="form-signup">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="signup-name" placeholder="Jane Doe" autocomplete="name" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password" />
        </div>
        <button class="btn btn-accent" id="signup-btn" onclick="doSignUp()">Create Account</button>
        <p class="error-msg" id="signup-error"></p>
        <p class="info-msg" id="signup-info"></p>
      </div>

    </div>
  </div>
</div>

<!-- ══════════════════════ SCAN PAGE (placeholder — Phase 3 builds this out) ══════════════════════ -->
<div class="page" id="page-scan">
  <header>
    <div>
      <h1>Solar Asset Tracker</h1>
      <span id="user-email-display"></span>
    </div>
    <div class="header-actions">
      <button class="nav-btn has-badge" id="approvals-nav-btn" data-count="0"
              style="display:none" onclick="openApprovalsPage()">
        Pending Approvals
      </button>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="scan-body">
    <div class="placeholder-card">
      <h3>You're logged in ✅</h3>
      <p>Scan/View functionality (Phase 3) will appear here next.</p>
    </div>
  </div>
</div>

<!-- ══════════════════════ ADMIN: PENDING APPROVALS PAGE ══════════════════════ -->
<div class="page" id="page-approvals">
  <header>
    <div>
      <h1>Pending Approvals</h1>
      <span id="approvals-user-display"></span>
    </div>
    <div class="header-actions">
      <button class="nav-btn" onclick="backToScan()">← Back</button>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </header>

  <div class="approvals-body">
    <div class="approvals-header">
      <h2 id="approvals-title">New Sign-Ups Awaiting Approval</h2>
      <p id="approvals-subtitle">Approve to grant access, or reject to remove the request.</p>
    </div>

    <div class="auth-tabs" style="margin-bottom: 18px;">
      <div class="auth-tab active" id="tab-pending" onclick="switchApprovalsTab('pending')">
        Pending <span id="pending-tab-count"></span>
      </div>
      <div class="auth-tab" id="tab-approved" onclick="switchApprovalsTab('approved')">
        Approved <span id="approved-tab-count"></span>
      </div>
    </div>

    <div id="approvals-list"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // ─────────────────────────────────────────────────
  //  SUPABASE CONFIG
  // ─────────────────────────────────────────────────
  const SUPABASE_URL = 'https://qmagisntwjnelmgwghmu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYWdpc250d2puZWxtZ3dnaG11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2ODIzMzUsImV4cCI6MjA5NzI1ODMzNX0.4sgL_0yxEODZ30eTxZIXk38mwwp83sowMVqILJARnII';

  // ─────────────────────────────────────────────────
  //  STATE
  // ─────────────────────────────────────────────────
  let currentUser = null; // { access_token, email, id, role, full_name }
  let approvalsTab = 'pending'; // 'pending' | 'approved'

  // ─────────────────────────────────────────────────
  //  HELPERS
  // ─────────────────────────────────────────────────
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
  }

  function toast(msg, type = 'info', duration = 3500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), duration);
  }

  function setBtn(id, loading, idleLabel) {
    const b = document.getElementById(id);
    b.disabled = loading;
    b.innerHTML = loading ? `<span class="spinner spinner-dark"></span>${idleLabel}` : idleLabel;
  }

  function apiHeaders(token) {
    return {
      'apikey':        SUPABASE_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type':  'application/json'
    };
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ─────────────────────────────────────────────────
  //  AUTH TABS
  // ─────────────────────────────────────────────────
  function switchTab(which) {
    document.getElementById('tab-signin').classList.toggle('active', which === 'signin');
    document.getElementById('tab-signup').classList.toggle('active', which === 'signup');
    document.getElementById('form-signin').classList.toggle('active', which === 'signin');
    document.getElementById('form-signup').classList.toggle('active', which === 'signup');
  }

  // ─────────────────────────────────────────────────
  //  SIGN UP
  // ─────────────────────────────────────────────────
  async function doSignUp() {
    const name  = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pass  = document.getElementById('signup-password').value;
    const errEl = document.getElementById('signup-error');
    const infoEl = document.getElementById('signup-info');
    errEl.style.display = 'none';
    infoEl.style.display = 'none';

    if (!name || !email || !pass) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }
    if (pass.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      errEl.style.display = 'block';
      return;
    }

    setBtn('signup-btn', true, 'Create Account');

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error_description || data.msg || data.message || 'Sign up failed.');
      }

      const newUserId = data.id || (data.user && data.user.id);
      if (!newUserId) throw new Error('Unexpected response from server.');

      const token = data.access_token || SUPABASE_KEY;
      const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/profiles`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          id: newUserId,
          email: email,
          full_name: name,
          role: 'pending'
        })
      });

      if (!profileRes.ok) {
        const perr = await profileRes.json().catch(() => ({}));
        throw new Error(perr.message || 'Account created, but profile setup failed. Contact admin.');
      }

      infoEl.textContent = 'Account created! Please wait for admin approval before signing in.';
      infoEl.style.display = 'block';
      document.getElementById('signup-name').value = '';
      document.getElementById('signup-email').value = '';
      document.getElementById('signup-password').value = '';

    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      setBtn('signup-btn', false, 'Create Account');
    }
  }

  // ─────────────────────────────────────────────────
  //  SIGN IN
  // ─────────────────────────────────────────────────
  async function doSignIn() {
    const email = document.getElementById('signin-email').value.trim();
    const pass  = document.getElementById('signin-password').value;
    const errEl = document.getElementById('signin-error');
    errEl.style.display = 'none';

    if (!email || !pass) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.style.display = 'block';
      return;
    }

    setBtn('signin-btn', true, 'Sign In');

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error_description || data.msg || data.message || 'Login failed.');
      }

      const accessToken = data.access_token;
      const userId = data.user.id;

      const profileRes = await fetch(
        `${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=*`,
        { headers: apiHeaders(accessToken) }
      );
      const profiles = await profileRes.json();
      const profile = profiles[0];

      if (!profile) {
        throw new Error('No profile found for this account. Contact an admin.');
      }

      if (profile.role === 'pending') {
        throw new Error('Your account is awaiting admin approval. Please check back later.');
      }

      currentUser = {
        access_token: accessToken,
        email: data.user.email,
        id: userId,
        role: profile.role,
        full_name: profile.full_name
      };

      document.getElementById('user-email-display').textContent =
        `${currentUser.full_name || currentUser.email} (${currentUser.role})`;

      // Show/hide the admin-only Pending Approvals button
      const approvalsBtn = document.getElementById('approvals-nav-btn');
      if (currentUser.role === 'admin') {
        approvalsBtn.style.display = 'inline-block';
        refreshPendingCount();
      } else {
        approvalsBtn.style.display = 'none';
      }

      showPage('scan');

    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      setBtn('signin-btn', false, 'Sign In');
    }
  }

  // ─────────────────────────────────────────────────
  //  LOGOUT
  // ─────────────────────────────────────────────────
  function doLogout() {
    currentUser = null;
    document.getElementById('signin-email').value = '';
    document.getElementById('signin-password').value = '';
    switchTab('signin');
    showPage('login');
  }

  // ─────────────────────────────────────────────────
  //  ADMIN: PENDING APPROVALS
  // ─────────────────────────────────────────────────
  async function refreshPendingCount() {
    if (!currentUser || currentUser.role !== 'admin') return;
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/profiles?role=eq.pending&select=id`,
        { headers: apiHeaders(currentUser.access_token) }
      );
      const rows = await res.json();
      const btn = document.getElementById('approvals-nav-btn');
      btn.setAttribute('data-count', rows.length);
    } catch (e) {
      // Silent fail on badge count — not critical
    }
  }

  async function openApprovalsPage() {
    document.getElementById('approvals-user-display').textContent =
      `${currentUser.full_name || currentUser.email} (admin)`;
    showPage('approvals');
    switchApprovalsTab('pending');
  }

  function backToScan() {
    showPage('scan');
    refreshPendingCount();
  }

  function switchApprovalsTab(which) {
    approvalsTab = which;
    document.getElementById('tab-pending').classList.toggle('active', which === 'pending');
    document.getElementById('tab-approved').classList.toggle('active', which === 'approved');

    const title = document.getElementById('approvals-title');
    const subtitle = document.getElementById('approvals-subtitle');
    if (which === 'pending') {
      title.textContent = 'New Sign-Ups Awaiting Approval';
      subtitle.textContent = 'Approve to grant access, or reject to remove the request.';
    } else {
      title.textContent = 'Approved Users';
      subtitle.textContent = 'Everyone with active access. Remove to revoke and delete their profile.';
    }

    loadApprovalsList();
  }

  async function loadApprovalsList() {
    const listEl = document.getElementById('approvals-list');
    listEl.innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px 0;">Loading...</p>';

    const roleFilter = approvalsTab === 'pending' ? 'eq.pending' : 'eq.user';

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/profiles?role=${roleFilter}&select=*&order=created_at.asc`,
        { headers: apiHeaders(currentUser.access_token) }
      );
      if (!res.ok) throw new Error('Failed to load users.');

      const rows = await res.json();
      updateTabCounts(approvalsTab, rows.length);

      if (rows.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <p>${approvalsTab === 'pending'
              ? 'No pending sign-ups right now. New sign-ups will appear here.'
              : 'No approved users yet.'}</p>
          </div>`;
        return;
      }

      if (approvalsTab === 'pending') {
        listEl.innerHTML = rows.map(u => `
          <div class="user-card" id="user-card-${u.id}">
            <div class="user-info">
              <h4>${escapeHtml(u.full_name || '(No name)')}</h4>
              <p>${escapeHtml(u.email)}</p>
            </div>
            <div class="user-actions">
              <button class="btn btn-sm btn-approve" onclick="approveUser('${u.id}')">Approve</button>
              <button class="btn btn-sm btn-reject" onclick="rejectUser('${u.id}')">Reject</button>
            </div>
          </div>
        `).join('');
      } else {
        listEl.innerHTML = rows.map(u => `
          <div class="user-card" id="user-card-${u.id}">
            <div class="user-info">
              <h4>${escapeHtml(u.full_name || '(No name)')}</h4>
              <p>${escapeHtml(u.email)}</p>
            </div>
            <div class="user-actions">
              <button class="btn btn-sm btn-remove" onclick="removeApprovedUser('${u.id}')">Remove</button>
            </div>
          </div>
        `).join('');
      }

    } catch (e) {
      listEl.innerHTML = `<div class="empty-state"><p>Error loading list: ${escapeHtml(e.message)}</p></div>`;
    }
  }

  async function updateTabCounts(currentlyLoadedTab, currentlyLoadedCount) {
    // Update the badge for whichever tab we just loaded
    const el = currentlyLoadedTab === 'pending'
      ? document.getElementById('pending-tab-count')
      : document.getElementById('approved-tab-count');
    el.innerHTML = `<span class="tab-count">${currentlyLoadedCount}</span>`;
  }

  async function approveUser(userId) {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}`, {
        method: 'PATCH',
        headers: { ...apiHeaders(currentUser.access_token), 'Prefer': 'return=minimal' },
        body: JSON.stringify({ role: 'user' })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Failed to approve user.');
      }
      toast('User approved!', 'success');
      document.getElementById(`user-card-${userId}`)?.remove();
      refreshPendingCount();
      // Show empty state if list is now empty
      if (!document.querySelector('.user-card')) loadApprovalsList();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  async function rejectUser(userId) {
    if (!confirm('Reject this sign-up? This will permanently delete their account request.')) return;
    try {
      // Deleting the profile row. Note: the underlying auth.users entry remains;
      // for full removal, an admin can also delete the user from
      // Supabase Authentication > Users manually.
      const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}`, {
        method: 'DELETE',
        headers: { ...apiHeaders(currentUser.access_token), 'Prefer': 'return=minimal' }
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Failed to reject user.');
      }
      toast('Sign-up rejected.', 'success');
      document.getElementById(`user-card-${userId}`)?.remove();
      refreshPendingCount();
      if (!document.querySelector('.user-card')) loadApprovalsList();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  async function removeApprovedUser(userId) {
    if (!confirm('Remove this user? This will permanently delete their profile and revoke their access. They will need to sign up again to regain access.')) return;
    try {
      // Deleting the profile row. Note: the underlying auth.users entry remains;
      // for full removal, an admin can also delete the user from
      // Supabase Authentication > Users manually.
      const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}`, {
        method: 'DELETE',
        headers: { ...apiHeaders(currentUser.access_token), 'Prefer': 'return=minimal' }
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Failed to remove user.');
      }
      toast('User removed.', 'success');
      document.getElementById(`user-card-${userId}`)?.remove();
      if (!document.querySelector('.user-card')) loadApprovalsList();
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  // ─────────────────────────────────────────────────
  //  ENTER KEY SHORTCUTS
  // ─────────────────────────────────────────────────
  document.getElementById('signin-password')
    .addEventListener('keydown', e => { if (e.key === 'Enter') doSignIn(); });
  document.getElementById('signup-password')
    .addEventListener('keydown', e => { if (e.key === 'Enter') doSignUp(); });
</script>
</body>
</html>
