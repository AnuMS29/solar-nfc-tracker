<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Panel Tracker</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0d1b3e;
      --navy-light: #1a2f5e;
      --gold: #f0b429;
      --gold-dark: #c99a1e;
      --bg: #f4f6fb;
      --white: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #d1d5db;
      --error: #dc2626;
      --success: #16a34a;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Page System ── */
    .page { display: none; min-height: 100dvh; flex-direction: column; }
    .page.active { display: flex; }

    /* ── Header ── */
    header {
      background: var(--navy);
      color: var(--white);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.3px; }
    header span { font-size: 0.75rem; color: var(--gold); font-weight: 500; }

    .logout-btn {
      background: transparent;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .logout-btn:hover { background: var(--gold); color: var(--navy); }

    /* ── Login Page ── */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 60%, #2a4080 100%);
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 36px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo .icon { font-size: 2.8rem; }
    .login-logo h2 { font-size: 1.3rem; color: var(--navy); margin-top: 8px; font-weight: 700; }
    .login-logo p { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }

    /* ── Form Controls ── */
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--white);
      transition: border-color 0.2s;
      outline: none;
      font-family: inherit;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus { border-color: var(--navy); }
    .field input[readonly] {
      background: #f1f5ff;
      color: var(--navy);
      font-weight: 600;
      cursor: default;
    }
    .field textarea { resize: vertical; min-height: 80px; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-primary { background: var(--navy); color: var(--white); }
    .btn-primary:hover:not(:disabled) { background: var(--navy-light); }
    .btn-gold { background: var(--gold); color: var(--navy); }
    .btn-gold:hover:not(:disabled) { background: var(--gold-dark); }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--navy);
      color: var(--navy);
    }

    /* ── Scan Page ── */
    .scan-body {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
    }

    .scan-area {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .scan-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 2.2rem;
    }
    .scan-area h3 { font-size: 1.1rem; color: var(--navy); margin-bottom: 6px; }
    .scan-area p { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }

    .nfc-unsupported {
      background: #fff7ed;
      border: 1.5px solid #fed7aa;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.82rem;
      color: #9a3412;
      margin-bottom: 16px;
      display: none;
    }

    .manual-input {
      display: none;
      margin-top: 14px;
    }
    .manual-input.visible { display: block; }

    /* ── Panel Form ── */
    .panel-form {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--shadow);
      display: none;
    }
    .panel-form.visible { display: block; }
    .panel-form h3 {
      font-size: 1rem;
      color: var(--navy);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--gold);
    }

    .form-row { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 380px) { .form-row { grid-template-columns: 1fr; } }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .status-Good { background: #dcfce7; color: #15803d; }
    .status-Faulty { background: #fee2e2; color: #b91c1c; }
    .status-Under\.Maintenance { background: #fef9c3; color: #a16207; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--navy);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .scanning-pulse {
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .divider {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin: 12px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════ LOGIN PAGE ═══════════════════════════════ -->
<div class="page active" id="page-login">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">☀️</div>
        <h2>Solar Panel Tracker</h2>
        <p>NFC-based field management</p>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-gold" id="login-btn" onclick="doLogin()">Sign In</button>
      <p id="login-error" style="color:var(--error);font-size:0.82rem;margin-top:12px;text-align:center;display:none;"></p>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════ SCAN PAGE ════════════════════════════════ -->
<div class="page" id="page-scan">
  <header>
    <div>
      <h1>☀️ Panel Tracker</h1>
      <span id="user-email-display"></span>
    </div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </header>

  <div class="scan-body">
    <!-- NFC Scan Area -->
    <div class="scan-area">
      <div class="scan-icon" id="scan-icon">📡</div>
      <h3 id="scan-title">Scan NFC Tag</h3>
      <p id="scan-desc">Hold your phone near a panel's NFC tag to load its data.</p>

      <div class="nfc-unsupported" id="nfc-warning">
        ⚠️ Web NFC is not supported on this device. Use manual entry below.
        (Web NFC requires Android + Chrome 89+)
      </div>

      <button class="btn btn-gold" id="scan-btn" onclick="startNFCScan()">
        Scan NFC Tag
      </button>

      <div class="divider" id="manual-divider">or enter manually</div>

      <div class="manual-input visible" id="manual-area">
        <div class="field" style="text-align:left">
          <label>Panel ID</label>
          <input type="text" id="manual-panel-id" placeholder="e.g. PANEL-001" />
        </div>
        <button class="btn btn-outline" onclick="loadPanelManually()">Load Panel</button>
      </div>
    </div>

    <!-- Panel Edit Form -->
    <div class="panel-form" id="panel-form">
      <h3>🔧 Panel Details</h3>
      <div class="field">
        <label>Panel ID</label>
        <input type="text" id="f-panel-id" readonly />
      </div>
      <div class="form-row">
        <div class="field">
          <label>Manufacturer</label>
          <input type="text" id="f-manufacturer" placeholder="e.g. Tata Solar" />
        </div>
        <div class="field">
          <label>Model</label>
          <input type="text" id="f-model" placeholder="e.g. TS-400W" />
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Wattage (W)</label>
          <input type="number" id="f-wattage" placeholder="e.g. 400" min="1" max="9999" />
        </div>
        <div class="field">
          <label>Status</label>
          <select id="f-status">
            <option value="Good">✅ Good</option>
            <option value="Faulty">❌ Faulty</option>
            <option value="Under Maintenance">🔧 Under Maintenance</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="f-notes" placeholder="Any observations, issues, or maintenance history..."></textarea>
      </div>

      <button class="btn btn-gold" id="save-btn" onclick="savePanel()">
        Save &amp; Write NFC
      </button>

      <button class="btn btn-outline" style="margin-top:10px" onclick="resetScan()">
        ← Scan Another
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════ SCRIPT ═══════════════════════════════════ -->
<script>
  // ──────────────────────────────────────────────
  //  CONFIG  — replace with your Supabase values
  // ──────────────────────────────────────────────
  const SUPABASE_URL = 'https://zzvszgripxamddpytjeu.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6dnN6Z3JpcHhhbWRkcHl0amV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNTc1MzcsImV4cCI6MjA5NjgzMzUzN30.mego9rfAuzGSLuRy0K0L5b5ZIGO5mQwr-X2bL5DeHSg';

  // ── Supabase thin client ────────────────────────
  const sb = {
    headers: {
      'apikey': SUPABASE_KEY,
      'Content-Type': 'application/json'
    },
    authHeaders(token) {
      return { ...this.headers, 'Authorization': `Bearer ${token}` };
    }
  };

  let currentUser = null;   // { access_token, email }
  let currentPanelId = null;
  let nfcSupported = 'NDEFReader' in window;

  // ── Page helpers ────────────────────────────────
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
  }

  function toast(msg, type = 'info', duration = 3000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), duration);
  }

  function setBtn(id, loading, label) {
    const b = document.getElementById(id);
    b.disabled = loading;
    b.innerHTML = loading ? `<span class="spinner"></span> ${label}` : label;
  }

  // ── Auth ────────────────────────────────────────
  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    if (!email || !pass) { errEl.textContent = 'Enter email and password.'; errEl.style.display = 'block'; return; }

    setBtn('login-btn', true, 'Signing in…');

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: sb.headers,
        body: JSON.stringify({ email, password: pass })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error_description || data.message || 'Login failed');

      currentUser = { access_token: data.access_token, email: data.user.email };
      document.getElementById('user-email-display').textContent = currentUser.email;

      initScanPage();
      showPage('scan');
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      setBtn('login-btn', false, 'Sign In');
    }
  }

  function doLogout() {
    currentUser = null;
    currentPanelId = null;
    resetScan();
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    showPage('login');
  }

  // ── Scan page init ──────────────────────────────
  function initScanPage() {
    if (!nfcSupported) {
      document.getElementById('nfc-warning').style.display = 'block';
      document.getElementById('scan-btn').style.display = 'none';
      document.getElementById('manual-divider').style.display = 'none';
    }
  }

  function resetScan() {
    currentPanelId = null;
    document.getElementById('panel-form').classList.remove('visible');
    document.getElementById('scan-icon').textContent = '📡';
    document.getElementById('scan-icon').classList.remove('scanning-pulse');
    document.getElementById('scan-title').textContent = 'Scan NFC Tag';
    document.getElementById('scan-desc').textContent = "Hold your phone near a panel's NFC tag to load its data.";
    document.getElementById('scan-btn').disabled = false;
    document.getElementById('manual-panel-id').value = '';
  }

  // ── NFC Scan ────────────────────────────────────
  async function startNFCScan() {
    if (!nfcSupported) { toast('Web NFC not supported on this device.', 'error'); return; }

    document.getElementById('scan-icon').textContent = '🔍';
    document.getElementById('scan-icon').classList.add('scanning-pulse');
    document.getElementById('scan-title').textContent = 'Scanning…';
    document.getElementById('scan-desc').textContent = 'Hold the phone steady near the NFC tag.';
    document.getElementById('scan-btn').disabled = true;

    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      toast('NFC ready — tap the tag now', 'info', 4000);

      ndef.onreadingerror = () => { toast('Could not read tag. Try again.', 'error'); resetScan(); };

      ndef.onreading = async ({ message }) => {
        let panelId = null;
        for (const record of message.records) {
          if (record.recordType === 'text') {
            const decoder = new TextDecoder(record.encoding || 'utf-8');
            const text = decoder.decode(record.data);
            if (text.startsWith('PANEL-') || text.length > 0) { panelId = text.trim(); break; }
          }
        }
        if (!panelId) { toast('No Panel ID found on tag.', 'error'); resetScan(); return; }
        await loadPanel(panelId);
      };
    } catch (e) {
      const msg = e.name === 'NotAllowedError'
        ? 'NFC permission denied. Allow it in browser settings.'
        : e.message;
      toast(msg, 'error');
      resetScan();
    }
  }

  // ── Manual Load ─────────────────────────────────
  async function loadPanelManually() {
    const id = document.getElementById('manual-panel-id').value.trim();
    if (!id) { toast('Enter a Panel ID first.', 'error'); return; }
    await loadPanel(id);
  }

  // ── Firestore-equivalent: fetch from Supabase ───
  async function loadPanel(panelId) {
    currentPanelId = panelId;
    document.getElementById('scan-icon').textContent = '⏳';
    document.getElementById('scan-title').textContent = 'Loading…';

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/panels?panel_id=eq.${encodeURIComponent(panelId)}&select=*`,
        { headers: sb.authHeaders(currentUser.access_token) }
      );
      if (!res.ok) throw new Error('Fetch failed: ' + res.statusText);

      const rows = await res.json();
      const panel = rows[0] || {};   // empty object = new panel

      // Populate form
      document.getElementById('f-panel-id').value      = panelId;
      document.getElementById('f-manufacturer').value  = panel.manufacturer || '';
      document.getElementById('f-model').value         = panel.model        || '';
      document.getElementById('f-wattage').value       = panel.wattage      || '';
      document.getElementById('f-status').value        = panel.status       || 'Good';
      document.getElementById('f-notes').value         = panel.notes        || '';

      document.getElementById('scan-icon').textContent = '✅';
      document.getElementById('scan-icon').classList.remove('scanning-pulse');
      document.getElementById('scan-title').textContent = 'Panel Loaded';
      document.getElementById('scan-desc').textContent = `ID: ${panelId}`;
      document.getElementById('panel-form').classList.add('visible');

    } catch (e) {
      toast('Error loading panel: ' + e.message, 'error');
      resetScan();
    }
  }

  // ── Save ────────────────────────────────────────
  async function savePanel() {
    if (!currentPanelId) return;

    const payload = {
      panel_id:     currentPanelId,
      manufacturer: document.getElementById('f-manufacturer').value.trim(),
      model:        document.getElementById('f-model').value.trim(),
      wattage:      parseInt(document.getElementById('f-wattage').value) || null,
      status:       document.getElementById('f-status').value,
      notes:        document.getElementById('f-notes').value.trim(),
      updated_at:   new Date().toISOString(),
      updated_by:   null   // optional: store user id
    };

    setBtn('save-btn', true, 'Saving…');

    try {
      // 1. Write to Supabase (upsert)
      const res = await fetch(`${SUPABASE_URL}/rest/v1/panels`, {
        method: 'POST',
        headers: {
          ...sb.authHeaders(currentUser.access_token),
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || 'Save failed');
      }

      // 2. Write back to NFC tag (if supported)
      if (nfcSupported) {
        try {
          const writer = new NDEFReader();
          await writer.write({ records: [{ recordType: 'text', data: currentPanelId }] });
          toast('✅ Saved & NFC tag written!', 'success');
        } catch (nfcErr) {
          // Save succeeded but NFC write failed — still a win
          toast('✅ Saved! NFC write skipped: ' + nfcErr.message, 'success', 4000);
        }
      } else {
        toast('✅ Panel data saved!', 'success');
      }

    } catch (e) {
      toast('❌ Error: ' + e.message, 'error', 5000);
    } finally {
      setBtn('save-btn', false, 'Save & Write NFC');
    }
  }

  // ── Enter key on login ──────────────────────────
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
